<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen List - Panel Principal</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="dark-theme">

    <header class="navbar">
        <div class="nav-brand">Zen List</div>
        <nav class="nav-links">
            <a href="#" class="active">List</a>
            <a href="#">Leaderboard</a>
            <a href="#">Submit</a>
        </nav>
        <div class="nav-user">
            <span id="user-welcome">Cargando...</span>
            <button id="btn-logout" class="btn-logout-mini">Cerrar Sesión</button>
        </div>
    </header>

    <div class="main-layout">
        
        <aside class="sidebar-levels">
            <div class="search-box">
                <input type="text" placeholder="Search Levels">
            </div>
            <div class="levels-list">

                <div class="level-card active">
                    <span class="level-pos">#1</span>
                    <div class="level-info">
                        <h3>Load page</h3></h3>
                        <p>by load</p>
                    </div>
                </div>
                <div class="level-card">
                    <span class="level-pos">#2</span>
                    <div class="level-info">
                        <h3>???</h3>
                        <p>load</p>
                    </div>
                </div>
                <div class="level-card">
                    <span class="level-pos">#3</span>
                    <div class="level-info">
                        <h3>Etuieukalbakorp</h3>
                        <p>by lenzi7o</p>
                    </div>
                </div>
            </div>
        </aside>

        <main class="level-details">
            <div class="details-header">
                <h2>Log09</h2>
                <p>by ??? | Verified by ???</p>
            </div>
            
            <div class="video-container">
                <div class="video-placeholder">
                    <span>YouTube Próximamente</span>
                </div>
            </div>

            <div class="level-stats">
                <div class="stat-box"><span>PASSWORD</span><strong>0000</strong></div>
                <div class="stat-box"><span>ID</span><strong>149665735</strong></div>
                <div class="stat-box"><span>LENGTH</span><strong>29s</strong></div>
            </div>
            
            <div class="records-section">
                <h3>Records</h3>
                <ul class="records-list">
                    <li><span>???</span> <span>Video (100%)</span></li>
                    <li><span>???</span> <span>Video (100%)</span></li>
                </ul>
            </div>
        </main>

    </div>

    <script src="home.js"></script>
</body>
</html>
